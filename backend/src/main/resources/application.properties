# Server Configuration
server.port=8080

# ================================================================
# JWT / Auth
# ================================================================
# Secret is read from the APP_JWT_SECRET env var in real deployments;
# the fallback below is DEV-ONLY and must be overridden in production.
# HS256 requires at least 32 bytes (256 bits).
app.jwt.secret=${APP_JWT_SECRET:dev-only-change-me-expense-tracker-jwt-signing-key-please-override-in-prod}
app.jwt.access-expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000

# ================================================================
# CORS — origins allowed to call /api/**
# ================================================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Serialize java.time values (Instant) as ISO-8601 strings, not arrays
spring.jackson.serialization.write-dates-as-timestamps=false

# ================================================================
# OpenAPI / Swagger UI (springdoc)
# ================================================================
# Spec JSON at /v3/api-docs (import into Postman), interactive UI at
# /swagger-ui.html. See config/OpenApiConfig.java for metadata + the
# JWT bearer security scheme, and docs/api/README.md for conventions.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# H2 Database Configuration (for development)
# File-based storage so data SURVIVES restarts. The DB lives in
# ./data/expensedb.mv.db relative to the backend working directory
# (i.e. backend/data/ when running `mvn spring-boot:run`). The
# embedded /h2-console runs in the same JVM, so no AUTO_SERVER flag
# is needed. (Note: H2 rejects AUTO_SERVER combined with
# DB_CLOSE_ON_EXIT, so we keep the URL plain aside from WRITE_DELAY.)
#
# WRITE_DELAY=0 flushes every committed transaction to disk
# immediately, so data survives even an ungraceful shutdown
# (IDE "stop", kill, crash) — not just a clean Ctrl+C. Negligible
# overhead for a single-user dev database.
spring.datasource.url=jdbc:h2:file:./data/expensedb;WRITE_DELAY=0
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# For production with MySQL, uncomment below:
# spring.datasource.url=jdbc:mysql://localhost:3306/expensedb
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ================================================================
# Actuator exposure — explicit allow-list
# ================================================================
# Spring Boot's default actuator exposure is already narrow
# (health + info), but the defaults are not visible to static
# analysis tools like CodeQL, which then flag the dependency as
# "exposed". Pinning the exposure explicitly here closes that
# alert and makes the contract obvious for future readers.
#
# Only /actuator/health is exposed. /actuator/info and everything
# else (env, beans, mappings, threaddump, heapdump, metrics) are
# blocked. Health output is locked to {status: UP|DOWN} — no
# component-level detail is ever returned to unauthenticated
# callers, even in dev.
#
# When Spring Security is added (Phase 1), the actuator endpoints
# will additionally be placed behind authentication. Until then,
# this allow-list is the only gate.
management.endpoints.web.exposure.include=health
management.endpoints.web.exposure.exclude=env,beans,mappings,threaddump,heapdump,metrics,loggers,configprops
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false
management.info.java.enabled=false
management.info.os.enabled=false
management.info.build.enabled=false
management.info.git.enabled=false
